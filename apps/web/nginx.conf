# =============================================================================
# nginx config for the SoundDocs SPA (self-host).
#
# Goals:
#   1. Serve the Vite static build from /usr/share/nginx/html.
#   2. SPA fallback: any unknown path -> /index.html (React Router).
#   3. Send the SAME cross-origin isolation headers Vite sends in dev
#      (apps/web/vite.config.ts): COOP=same-origin + COEP=require-corp.
#      These are REQUIRED for SharedArrayBuffer / the audio analyzer worklets.
#      They are applied to index.html too (see the `always` flag + headers in
#      the SPA location and the catch-all).
#   4. Correct MIME types for .js / .mjs / .wasm and worklet files emitted
#      under assets/worklets/.
#
# If you put a reverse proxy (Caddy/Traefik/nginx) in front of this in
# production, it MUST preserve these two headers or the analyzer breaks.
# =============================================================================

map $sent_http_content_type $coep_value {
    default "require-corp";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Make sure .wasm is served with the right type (some nginx builds lack it).
    types {
        application/wasm wasm;
    }

    # ----- Cross-origin isolation (apply to everything, including HTML) -----
    # `always` ensures the header is set even on error/SPA-fallback responses.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ----- Hashed, immutable assets (Vite emits content-hashed filenames) -----
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # Same-origin assets need this so they can be embedded under COEP.
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # AudioWorklet processors are emitted under assets/worklets/*.worklet.js.
    # They are plain JS; the /assets/ block above already covers caching +
    # headers. This block just guarantees the JS content type.
    location ~* \.worklet\.js$ {
        default_type application/javascript;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ----- SPA fallback: serve index.html for client-side routes -----
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # Never cache the HTML shell so updated bundles are picked up.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
